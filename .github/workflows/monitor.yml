name: Monitor de Passagens

on:
  schedule:
    # Roda no minuto 15 para fugir da fila da hora cheia no GitHub
    # Horários no Brasil (BRT): 08:15, 10:15, 12:15, 14:15, 16:15, 18:15, 19:15 e 20:15
    - cron: '15 11,13,15,17,19,21,22,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar-voos:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir a pasta do robô
        uses: actions/checkout@v4

      - name: Ligar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar o navegador invisível (Playwright)
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Executar a busca de passagens
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robo_voos.py

      - name: Salvar histórico para não repetir alertas
        run: |
          if [ -f historico.txt ]; then
            git config user.name "Robô de Voos"
            git config user.email "robo@github.com"
            git add historico.txt
            git diff --staged --quiet || git commit -m "Atualiza histórico de alertas enviados"
            git push
          fi
